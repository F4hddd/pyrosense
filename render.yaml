# Render blueprint for the PyroSense public mirror.
#
# This deploys ONLY the cloud dashboard. Detection stays on the machine at the
# site - see DEPLOY.md. Nothing here can reach your cameras, and no camera
# credential belongs in this file.
#
# Two ways to use it:
#   Blueprint  Render -> New -> Blueprint -> pick the repo. Reads this file.
#   Manual     Render -> New -> Web Service. Ignores this file; copy the
#              buildCommand/startCommand below into the form by hand.
#
# Defaults here are FREE-TIER SAFE. The free plan has no persistent disk, so the
# mirror keeps its event history in memory and starts empty after a restart. That
# is survivable - the site machine holds the authoritative event log - but see
# the disk block below to keep public history across deploys.
services:
  - type: web
    name: pyrosense-mirror
    runtime: python
    plan: free             # -> starter ($7) for no spin-down and disk support
    region: ohio           # pick the region nearest the site
    branch: main
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn pyrosense.cloud.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true

    # ---- Persistent history: requires a PAID plan --------------------------
    # Uncomment BOTH this disk block and the PYRO_DATA_DIR variable below once
    # you are on starter or above. Without them the mirror still works; it just
    # forgets past incidents whenever the service restarts.
    #
    # disk:
    #   name: pyrosense-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      # - key: PYRO_DATA_DIR        # paid plans only, with the disk above
      #   value: /var/data
      - key: PYRO_SITE_NAME
        value: Home Workshop
      - key: PYRO_STALE_S
        value: "45"
      - key: PYRO_OFFLINE_S
        value: "180"
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ---- secrets: set these in the Render dashboard, not in git ----
      - key: PYRO_INGEST_TOKEN     # shared with the local agent. Generate with:
        sync: false                #   python -c "import secrets;print(secrets.token_urlsafe(32))"
      - key: PYRO_ACK_PIN          # required to acknowledge from the public page
        sync: false
      - key: PYRO_PUBLIC_TOKEN     # optional: makes the dashboard link-private (?k=...)
        sync: false

      # ---- watchdog: alerts YOU when the site itself goes quiet ----
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false
      - key: NTFY_TOPIC
        sync: false
